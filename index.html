<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ziyan Liu — professional links and resume.">
  <title>Ziyan Liu</title>
  <style>
    :root { --ink: #3f4650; --muted: #78818c; --accent: #2d79a8; --rule: #e4e8eb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fff; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    main { width: min(760px, calc(100% - 48px)); padding: 42px 0; }
    h1 { margin: 0 0 28px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(38px, 6vw, 52px); font-weight: 500; letter-spacing: -.7px; }
    nav { display: flex; flex-wrap: wrap; gap: 0 22px; padding-top: 18px; border-top: 1px solid var(--rule); }
    a { padding: 8px 0; color: var(--accent); font-size: 16px; text-decoration: none; text-underline-offset: 4px; }
    a:hover, a:focus-visible { color: var(--ink); text-decoration: underline; outline: none; }
    @media (max-width: 600px) { main { width: min(100% - 40px, 760px); } nav { display: grid; gap: 5px; } }
  </style>
</head>
<body>
  <main>
    <h1>Ziyan Liu</h1>
    <nav aria-label="Professional links">
      <a href="https://www.linkedin.com/in/ziyan-liu-50391894" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://scholar.google.com/citations?user=JzIeqTcAAAAJ&amp;hl=en&amp;authuser=1" target="_blank" rel="noopener noreferrer">Google Scholar</a>
      <a href="resume_ziyan.pdf" download>Download résumé</a>
    </nav>
  </main>
</body>
</html>
