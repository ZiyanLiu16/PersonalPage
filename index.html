<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ziyan Liu — professional links.">
  <title>Ziyan Liu</title>
  <style>
    :root { --ink: #343b44; --muted: #78818c; --accent: #2d79a8; --rule: #e4e8eb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: #fff; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    main { width: min(1120px, calc(100% - 64px)); min-height: 100vh; margin: 0 auto; display: grid; grid-template-columns: minmax(250px, .78fr) minmax(420px, 1.22fr); align-items: center; gap: clamp(44px, 7vw, 96px); padding: 56px 0; }
    .details { padding: 24px 0; }
    h1 { margin: 0 0 30px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(42px, 5vw, 64px); font-weight: 500; letter-spacing: -.9px; }
    .line { width: 42px; height: 1px; margin-bottom: 18px; background: var(--rule); }
    nav { display: grid; gap: 8px; }
    a { width: fit-content; padding: 5px 0; color: var(--accent); font-size: 16px; text-decoration: none; text-underline-offset: 4px; }
    a:hover, a:focus-visible { color: var(--ink); text-decoration: underline; outline: none; }
    .service { margin-top: 44px; }
    h2 { margin: 0 0 18px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .service-list { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; }
    .service-list li { padding-left: 14px; border-left: 1px solid var(--rule); }
    .service-role, .service-venue, .service-date { display: block; }
    .service-role { margin-bottom: 3px; font-size: 15px; font-weight: 600; }
    .service-venue { color: var(--ink); font-size: 14px; line-height: 1.45; }
    .service-date { margin-top: 3px; color: var(--muted); font-size: 13px; }
    figure { width: 100%; margin: 0; }
    img { width: 100%; height: auto; display: block; }
    @media (max-width: 720px) {
      main { width: min(100% - 40px, 560px); min-height: auto; grid-template-columns: 1fr; gap: 30px; padding: 40px 0 48px; }
      .details { order: 2; padding: 0; }
      figure { order: 1; }
    }
  </style>
</head>
<body>
  <main>
    <section class="details" aria-label="Professional links">
      <h1>Ziyan Liu</h1>
      <div class="line" aria-hidden="true"></div>
      <nav>
        <a href="https://www.linkedin.com/in/ziyan-liu-50391894" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://scholar.google.com/citations?user=JzIeqTcAAAAJ&amp;hl=en&amp;authuser=1" target="_blank" rel="noopener noreferrer">Google Scholar</a>
        <a href="https://orcid.org/0009-0002-5945-4923" target="_blank" rel="noopener noreferrer">ORCID</a>
      </nav>
      <section class="service" aria-labelledby="service-heading">
        <h2 id="service-heading">Academic Service</h2>
        <ul class="service-list">
          <li>
            <span class="service-role">Program Committee Member</span>
            <span class="service-venue">The 20th ACM International Conference on Web Search and Data Mining (WSDM 2027)</span>
            <span class="service-date">Aug 2026 – Oct 2026</span>
          </li>
          <li>
            <span class="service-role">Reviewer</span>
            <span class="service-venue">IEEE Transactions on Dependable and Secure Computing</span>
            <span class="service-date">2026</span>
          </li>
          <li>
            <span class="service-role">Reviewer</span>
            <span class="service-venue">Neural Networks</span>
            <span class="service-date">2026</span>
          </li>
        </ul>
      </section>
    </section>
    <figure>
      <img src="portrait.jpg" alt="Ziyan Liu overlooking a sea of clouds at sunrise">
    </figure>
  </main>
</body>
</html>
